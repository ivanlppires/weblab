<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro ao vivo — dois frameworks na mesma página</title>

  <!-- A regra de ouro da §7.3 quebrada de propósito: Bootstrap E Tailwind juntos.
       O reset (preflight) do Tailwind é injetado depois e desmonta os componentes
       do Bootstrap; e as duas bibliotecas disputam .container, .card, .btn. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-4">
  <div class="container">
    <h1 class="h5 mb-3">Componentes do Bootstrap com o Tailwind carregado por cima</h1>

    <button class="btn btn-primary mb-3">Botão que deveria ser azul e arredondado</button>

    <div class="card mb-3" style="max-width: 22rem">
      <div class="card-body">
        <h2 class="h6 card-title">Card do Bootstrap</h2>
        <p class="card-text">Compare com o card da Demo 06: bordas, sombra e espaçamento saíram do lugar.</p>
      </div>
    </div>

    <div class="alert alert-warning mb-0">Alerta do Bootstrap</div>
  </div>
</body>
</html>
