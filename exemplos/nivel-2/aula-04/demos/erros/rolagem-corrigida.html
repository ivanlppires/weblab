<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referência — row dentro de container</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <style> .bloco { background:#6f4e37; color:#fff; padding:.75rem; border-radius:.5rem; } </style>
</head>
<body>
  <!-- CERTO: container → row → col. O padding do container compensa a margem negativa da row. -->
  <div class="container">
    <div class="row g-3">
      <div class="col-6"><div class="bloco">col-6</div></div>
      <div class="col-6"><div class="bloco">col-6</div></div>
    </div>
  </div>
  <p class="p-2 small mb-0">Sem rolagem horizontal, em qualquer largura.</p>
</body>
</html>
