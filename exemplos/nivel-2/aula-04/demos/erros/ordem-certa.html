<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referência — o meu CSS depois do framework</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

  <!-- CERTO: o estilo do projeto vem DEPOIS. Empate de especificidade, vence o último. -->
  <style>
    .card-title { color: #6f4e37; font-size: 2rem; }
    body { background: #fdfaf6; }
  </style>
</head>
<body class="p-4">
  <div class="card" style="max-width: 22rem">
    <div class="card-body">
      <h1 class="card-title h5">Título do card</h1>
      <p class="card-text">
        Agora a cor marrom e o tamanho maior valem. Uma linha de diferença no
        <code>&lt;head&gt;</code> — meia hora de bug economizada.
      </p>
    </div>
  </div>
</body>
</html>
