<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro ao vivo — o meu CSS antes do framework</title>

  <!-- ERRADO: o estilo do projeto vem PRIMEIRO. -->
  <style>
    /* Mesma especificidade da regra do Bootstrap (uma classe).
       Como esta declaração aparece ANTES, a cascata dá a vitória à dele. */
    .card-title { color: #6f4e37; font-size: 2rem; }
    body { background: #fdfaf6; }
  </style>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>
<body class="p-4">
  <div class="card" style="max-width: 22rem">
    <div class="card-body">
      <h1 class="card-title h5">Título do card</h1>
      <p class="card-text">
        O <code>font-size: 2rem</code> e a cor marrom foram declarados, mas perderam:
        no DevTools eles aparecem <s>riscados</s>.
      </p>
    </div>
  </div>
</body>
</html>
