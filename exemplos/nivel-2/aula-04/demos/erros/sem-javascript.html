<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro ao vivo — navbar sem o bundle JavaScript</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <style> .navbar { background: #6f4e37; } .navbar .navbar-brand, .navbar .nav-link { color: #fff; } </style>
</head>
<body>

  <!-- O CSS está aqui, o HTML está certo, o ARIA está certo.
       Falta só o bootstrap.bundle.min.js: o botão existe, mas não faz nada. -->
  <nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
    <div class="container">
      <a class="navbar-brand" href="#">Café Cerrado</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menu-sem-js"
              aria-controls="menu-sem-js" aria-expanded="false"
              aria-label="Abrir e fechar o menu de navegação">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-sem-js">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cardápio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <p class="mb-0">
      Estreite a janela abaixo de 992&nbsp;px e clique no hambúrguer: nada acontece.
      O <code>data-bs-toggle</code> é lido por JavaScript — sem o <code>bundle</code>,
      é só um atributo decorativo.
    </p>
  </div>

  <!-- O script que está faltando de propósito:
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  -->
</body>
</html>
