<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro ao vivo — row sem container</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <style> .bloco { background:#6f4e37; color:#fff; padding:.75rem; border-radius:.5rem; } </style>
</head>
<body>
  <!-- ERRADO: a row está solta no body. A margem negativa dela (-0.75rem de cada lado)
       não tem o padding de um container para compensar → o conteúdo vaza para fora da tela. -->
  <div class="row g-3 p-0">
    <div class="col-6"><div class="bloco">col-6</div></div>
    <div class="col-6"><div class="bloco">col-6</div></div>
  </div>
  <p class="p-2 small mb-0">Olhe a barra de rolagem horizontal no rodapé deste quadro.</p>
</body>
</html>
